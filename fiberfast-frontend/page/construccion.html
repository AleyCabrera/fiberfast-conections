<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sitio Web en Construcción</title>
     <link rel="icon" href="img/logo.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #4F528C;
            --primary-dark: #2C2E50;
            --accent: #F2C53D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .loader {
            border: 5px solid rgba(255,255,255,0.2);
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: var(--accent);
            color: #1a1a1a;
            font-weight: bold;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚧 Estamos Construyendo Algo Genial</h1>
        <p>Nuestro sitio web está en construcción. Muy pronto estaremos en línea con una experiencia mejorada.</p>

        <div class="loader"></div>

        <a href="./index.html" class="btn">Volver al Inicio</a>
    </div>

    <footer>
        © 2026 Fiber Fast- Todos los derechos reservados
    </footer>

</body>
</html>
